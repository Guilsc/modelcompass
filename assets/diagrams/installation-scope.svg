<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-label="ModelCompass installation scope: one GitHub skill installed per execution environment"><rect width="1100" height="430" rx="20" fill="#111827"/><style>text{font-family:Inter,system-ui,Arial,sans-serif;fill:#e5e7eb}.muted{fill:#9ca3af}.panel{fill:#1f2937;stroke:#475569;stroke-width:1.5}</style><text x="48" y="55" font-size="30" font-weight="700">Where ModelCompass is installed</text><text x="48" y="88" font-size="17" class="muted">Install once per runtime / profile; user-global does not mean all machines</text><rect x="345" y="113" width="410" height="64" rx="14" fill="#134e4a" stroke="#2dd4bf"/><text x="550" y="153" font-size="23" text-anchor="middle" font-weight="700">GitHub: ModelCompass</text><path d="M550 177 V208 M195 208 H905 M195 208 V231 M550 208 V231 M905 208 V231" fill="none" stroke="#64748b" stroke-width="3"/><rect class="panel" x="46" y="232" width="298" height="113" rx="14"/><rect class="panel" x="401" y="232" width="298" height="113" rx="14"/><rect class="panel" x="756" y="232" width="298" height="113" rx="14"/><text x="195" y="266" text-anchor="middle" font-size="22" font-weight="600">Local runtime</text><text x="195" y="294" text-anchor="middle" class="muted" font-size="15">CLI, desktop or IDE backend</text><text x="195" y="316" text-anchor="middle" class="muted" font-size="14">User-global or project scope</text><text x="550" y="266" text-anchor="middle" font-size="22" font-weight="600">Remote runtime</text><text x="550" y="294" text-anchor="middle" class="muted" font-size="15">VPS / cloud VM / gateway backend</text><text x="550" y="316" text-anchor="middle" class="muted" font-size="14">Install on remote filesystem</text><text x="905" y="266" text-anchor="middle" font-size="22" font-weight="600">Container / managed</text><text x="905" y="294" text-anchor="middle" class="muted" font-size="15">Docker, cloud containers, jobs</text><text x="905" y="316" text-anchor="middle" class="muted" font-size="14">Use durable volume or image layer</text><text x="550" y="397" text-anchor="middle" class="muted" font-size="16">The UI you open is not necessarily where your agent executes</text></svg>