<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="model-advice-title model-advice-desc">
  <title id="model-advice-title">Evidence first. Recommendation second.</title>
  <desc id="model-advice-desc">Artificial Analysis, Arena, BenchLM, and LiveBench provide source-specific evidence. The model advisor retains source metadata and checks freshness, task fit, and coverage. Adequate evidence supports explainable advice. Missing or stale evidence produces an explicit limitation, not a fabricated score or silent model switch.</desc>
  <defs>
    <marker id="model-advice-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8Z" fill="#bcc6d3"/>
    </marker>
    <marker id="model-advice-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8Z" fill="#8cb4ff"/>
    </marker>
  </defs>
  <rect width="960" height="760" rx="12" fill="#101722"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <path d="M129 242 V272" fill="none" stroke="#bcc6d3" stroke-width="1.8"/>
    <path d="M363 242 V272" fill="none" stroke="#bcc6d3" stroke-width="1.8"/>
    <path d="M597 242 V272" fill="none" stroke="#bcc6d3" stroke-width="1.8"/>
    <path d="M831 242 V272" fill="none" stroke="#bcc6d3" stroke-width="1.8"/>
    <path d="M129 272 H831" fill="none" stroke="#bcc6d3" stroke-width="1.8"/>
    <path d="M480 272 V310" fill="none" stroke="#bcc6d3" stroke-width="1.8" marker-end="url(#model-advice-arrow)"/>
    <path d="M480 414 V462" fill="none" stroke="#bcc6d3" stroke-width="1.8" marker-end="url(#model-advice-arrow)"/>
    <path d="M398 554 V598 Q398 606 390 606 H260 Q252 606 252 614 V638" fill="none" stroke="#bcc6d3" stroke-width="1.8" marker-end="url(#model-advice-arrow)"/>
    <rect x="170.5" y="570" width="139.0" height="25" rx="3" fill="#101722"/>
    <text x="240" y="588" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">enough evidence</text>
    <path d="M562 554 V598 Q562 606 570 606 H700 Q708 606 708 614 V638" fill="none" stroke="#bcc6d3" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#model-advice-arrow)"/>
    <rect x="625.9" y="570" width="188.2" height="25" rx="3" fill="#101722"/>
    <text x="720" y="588" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">insufficient evidence</text>
    <text x="36" y="40" font-size="12" fill="#bcc6d3" text-anchor="start" font-weight="400" letter-spacing="1.8">MODELCOMPASS</text>
    <text x="36" y="80" font-size="29" fill="#f3f1e9" text-anchor="start" font-weight="600" letter-spacing="0">Evidence first. Recommendation second.</text>
    <text x="36" y="110" font-size="17" fill="#bcc6d3" text-anchor="start" font-weight="400" letter-spacing="0">Keep each benchmark’s meaning, provenance, and freshness</text>
    <g data-node-id="source-0">
      <rect data-role="bounds" x="36" y="150" width="186" height="92" rx="9" fill="#1a2636" stroke="#bcc6d3" stroke-width="1"/>
      <text x="129.0" y="181" font-size="20" fill="#f3f1e9" text-anchor="middle" font-weight="600" letter-spacing="0">Artificial</text>
      <text x="129.0" y="208" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">Analysis</text>
      <text x="129.0" y="231" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">artificialanalysis.ai</text>
    </g>
    <g data-node-id="source-1">
      <rect data-role="bounds" x="270" y="150" width="186" height="92" rx="9" fill="#1a2636" stroke="#bcc6d3" stroke-width="1"/>
      <text x="363.0" y="181" font-size="20" fill="#f3f1e9" text-anchor="middle" font-weight="600" letter-spacing="0">Arena</text>
      <text x="363.0" y="208" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">arena.ai</text>
    </g>
    <g data-node-id="source-2">
      <rect data-role="bounds" x="504" y="150" width="186" height="92" rx="9" fill="#1a2636" stroke="#bcc6d3" stroke-width="1"/>
      <text x="597.0" y="181" font-size="20" fill="#f3f1e9" text-anchor="middle" font-weight="600" letter-spacing="0">BenchLM</text>
      <text x="597.0" y="208" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">benchlm.ai</text>
    </g>
    <g data-node-id="source-3">
      <rect data-role="bounds" x="738" y="150" width="186" height="92" rx="9" fill="#1a2636" stroke="#bcc6d3" stroke-width="1"/>
      <text x="831.0" y="181" font-size="20" fill="#f3f1e9" text-anchor="middle" font-weight="600" letter-spacing="0">LiveBench</text>
      <text x="831.0" y="208" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">livebench.ai</text>
    </g>
    <g data-node-id="evidence">
      <rect data-role="bounds" x="280" y="310" width="400" height="104" rx="9" fill="#1a2636" stroke="#bcc6d3" stroke-width="1"/>
      <text x="480.0" y="341" font-size="20" fill="#f3f1e9" text-anchor="middle" font-weight="600" letter-spacing="0">Source-aware evidence</text>
      <text x="480.0" y="368" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">Metric meaning + date + provenance</text>
      <text x="480.0" y="391" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">No cross-source score averaging</text>
    </g>
    <g data-node-id="checks">
      <rect data-role="bounds" x="330" y="462" width="300" height="92" rx="9" fill="#1a2636" stroke="#8cb4ff" stroke-width="2"/>
      <text x="480.0" y="493" font-size="20" fill="#f3f1e9" text-anchor="middle" font-weight="600" letter-spacing="0">Task fit + coverage</text>
      <text x="480.0" y="520" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">Freshness + missing-data checks</text>
    </g>
    <g data-node-id="advice">
      <rect data-role="bounds" x="102" y="638" width="300" height="80" rx="9" fill="#1a2636" stroke="#bcc6d3" stroke-width="1"/>
      <text x="252.0" y="669" font-size="20" fill="#f3f1e9" text-anchor="middle" font-weight="600" letter-spacing="0">Explainable advice</text>
      <text x="252.0" y="696" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">Trade-offs + cited evidence</text>
    </g>
    <g data-node-id="limits">
      <rect data-role="bounds" x="558" y="638" width="300" height="80" rx="9" fill="#1a2636" stroke="#bcc6d3" stroke-width="1"/>
      <text x="708.0" y="669" font-size="20" fill="#f3f1e9" text-anchor="middle" font-weight="600" letter-spacing="0">Explicit limitation</text>
      <text x="708.0" y="696" font-size="16" fill="#bcc6d3" text-anchor="middle" font-weight="400" letter-spacing="0">Missing / stale data disclosed</text>
    </g>
    <text x="36" y="744" font-size="15" fill="#bcc6d3" text-anchor="start" font-weight="400" letter-spacing="0">Advice never changes the host configuration or silently switches the active model.</text>
  </g>
</svg>
